<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151922" />
    <title>Offline – ZyvoMovie</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background: radial-gradient(circle at top, #1f2533 0%, #151922 55%, #0d0f14 100%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'DM Sans', 'Plus Jakarta Sans', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(18, 22, 29, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #E50914;
        color: #ffffff;
        font-weight: 900;
        font-size: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        box-shadow: 0 10px 26px rgba(229, 9, 20, 0.45);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.74);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button, a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      .primary {
        background: #E50914;
        color: #ffffff;
      }
      .secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">Z</div>
      <h1>You&rsquo;re currently offline</h1>
      <p>
        ZyvoMovie cannot reach the live catalog or streaming servers right now. Reconnect to the
        internet to browse movies, TV series, anime, and resume playback.
      </p>
      <div class="actions">
        <button type="button" class="primary" onclick="window.location.reload()">
          Retry Connection
        </button>
        <a href="/" class="secondary">Return to App Shell</a>
      </div>
    </main>
  </body>
</html>
